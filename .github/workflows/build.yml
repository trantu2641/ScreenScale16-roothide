name: Build ScreenScale16-roothide

on:
  workflow_dispatch:
  

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 \
              https://github.com/theos/theos.git \
              "$THEOS"
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Setup SDK
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          if [ ! -d "$THEOS/sdks" ]; then
            git clone --depth 1 \
              https://github.com/theos/sdks.git \
              "$THEOS/sdks"
          else
            echo "SDK directory already exists:"
            ls -la "$THEOS/sdks"
          fi

      - name: Build
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Build environment ==="
          echo "THEOS=$THEOS"
          echo "SDKs:"
          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          make clean

          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-roothide
          path: packages/*
          if-no-files-found: error
