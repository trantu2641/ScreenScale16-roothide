name: Build ScreenScale16

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git perl python3 unzip xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /home/runner/theos
          echo "THEOS=/home/runner/theos" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euxo pipefail
          export THEOS=/home/runner/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16
          path: packages/*
          if-no-files-found: error
