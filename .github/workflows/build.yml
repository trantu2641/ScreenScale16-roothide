name: Build ScreenScale16-roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          if [ ! -d "$THEOS" ]; then
            git clone --recursive --depth 1 \
              https://github.com/theos/theos.git \
              "$THEOS"
          fi

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Setup SDK
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          if [ ! -d "$THEOS/sdks" ]; then
            git clone --depth 1 \
              https://github.com/theos/sdks.git \
              "$THEOS/sdks"
          fi

          echo "=== Available SDKs ==="

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

      - name: Select available SDK
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          SDK_PATH="$(find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: No iPhoneOS SDK found"
            exit 1
          fi

          SDK_NAME="$(basename "$SDK_PATH")"

          echo "Using SDK: $SDK_NAME"

          echo "SDK_NAME=$SDK_NAME" >> "$GITHUB_ENV"

          sed -i.bak \
            "s/^TARGET = .*/TARGET = iphone:clang:${SDK_NAME#iPhoneOS}.0:16.0/" \
            Makefile || true

      - name: Build
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Build environment ==="
          echo "THEOS=$THEOS"
          echo "SDK=$SDK_NAME"

          make clean

          make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-roothide
          path: packages/* .deb
          if-no-files-found: error
