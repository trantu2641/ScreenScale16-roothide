name: Build ScreenScale16-roothide

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install SDK
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$THEOS/sdks"

      - name: Build roothide package
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          make clean

          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-roothide
          path: packages/*
          if-no-files-found: error
