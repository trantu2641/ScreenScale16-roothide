name: Build ScreenScale16-roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.10
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Install dm.pl
        run: |
          git clone --depth 1 https://github.com/theos/dm.pl.git "$HOME/dm.pl"
          chmod +x "$HOME/dm.pl/dm.pl"
          mkdir -p "$THEOS/bin"
          cp "$HOME/dm.pl/dm.pl" "$THEOS/bin/dm.pl"

      - name: Build
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-roothide
          path: packages/*.deb
          if-no-files-found: error
