name: Build ScreenScale16-roothide

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Setup SDK
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          if [ -d "$THEOS/sdks" ]; then
            echo "SDK directory already exists"
            find "$THEOS/sdks" \
              -maxdepth 1 \
              -type d \
              -name "*.sdk" \
              -print
          else
            git clone --depth 1 \
              https://github.com/theos/sdks.git \
              "$THEOS/sdks"
          fi

      - name: Build
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== Build environment ==="
          echo "THEOS=$THEOS"

          make clean
          make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16
          path: packages/*
          if-no-files-found: error
