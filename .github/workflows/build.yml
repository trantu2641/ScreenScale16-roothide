name: Build ScreenScale16 - Roothide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            make \
            perl \
            fakeroot \
            rsync \
            xz-utils \
            libio-compress-lzma-perl \
            clang \
            llvm \
            lld \
            build-essential \
            dpkg

      - name: Install Roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          rm -rf "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o /tmp/install-theos.sh

          chmod +x /tmp/install-theos.sh

          bash /tmp/install-theos.sh

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "=== Theos ==="
          test -d "$THEOS"
          ls -la "$THEOS"

      - name: Install iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"

          cd /tmp

          rm -f iPhoneOS16.5.sdk.tar.xz
          rm -rf iPhoneOS16.5.sdk

          curl -fL \
            "$SDK_URL" \
            -o iPhoneOS16.5.sdk.tar.xz

          tar -xJf iPhoneOS16.5.sdk.tar.xz

          test -d iPhoneOS16.5.sdk

          rm -rf "$THEOS/sdks/iPhoneOS16.5.sdk"

          cp -R \
            iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

          echo "=== Installed SDK ==="

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Verify Roothide Theos
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== SDK ==="

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "*.sdk" \
            -print

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "=== Roothide package scheme ==="

          test -d "$THEOS/vendor/mod/roothide"

          ls -la \
            "$THEOS/vendor/mod/roothide"

          echo "=== Compiler ==="

          command -v clang
          command -v clang++

          clang --version
          clang++ --version

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail

          export THEOS="$HOME/theos"

          export TARGET="iphone:clang:16.5:16.0"

          echo "=== Build environment ==="
          echo "THEOS=$THEOS"
          echo "TARGET=$TARGET"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Check DEB
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Packages ==="

          find packages \
            -type f \
            -name "*.deb" \
            -print

          DEB="$(find packages \
            -type f \
            -name "*.deb" \
            -print \
            -quit)"

          test -n "$DEB"

          echo "DEB=$DEB"

          dpkg-deb -I "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-roothide
          path: packages/*.deb
          if-no-files-found: error
